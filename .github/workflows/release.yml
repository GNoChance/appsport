name: Release

# Publie l'image privée ghcr.io/gnochance/appsport:vX.Y.Z pour un tag vX.Y.Z d'un commit de main dont ci.yml est vert.
# Rien ne se déploie ici (R-OPS-13) : GitHub n'atteint jamais le serveur, le propriétaire tire l'image lui-même.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Garde du tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag invalide : $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Garde de main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Le commit n'est pas sur main : publication refusée."
            exit 1
          fi

      - name: Garde CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&status=success" --jq '.total_count')
          if [ "${count:-0}" -lt 1 ]; then
            echo "La CI du commit ${GITHUB_SHA} n'est pas verte : publication refusée. Relancer ce job quand la CI de main sera verte."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/gnochance/appsport:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            VITE_OWNER_FIRST_NAME=${{ vars.VITE_OWNER_FIRST_NAME }}
