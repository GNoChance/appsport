# /etc/systemd/system/docker.service.d/rune.conf (R-OPS-2, R-DEP-5) : Docker ne démarre pas sans le
# volume chiffré monté sur /srv/rune (data-root de daemon.json) ; docker.service et docker.socket restent
# désactivés au démarrage, rune-unlock les lance après le déverrouillage.
[Unit]
RequiresMountsFor=/srv/rune
