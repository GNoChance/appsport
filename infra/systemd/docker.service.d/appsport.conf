# /etc/systemd/system/docker.service.d/appsport.conf (R-OPS-2, R-DEP-5) : Docker ne démarre pas sans le
# volume chiffré monté sur /srv/appsport (data-root de daemon.json) ; docker.service et docker.socket restent
# désactivés au démarrage, appsport-unlock les lance après le déverrouillage.
[Unit]
RequiresMountsFor=/srv/appsport
